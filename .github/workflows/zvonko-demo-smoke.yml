name: Zvonko web demo smoke
on:
  push:
    paths:
      - 'zvonko/worker.js'
      - '.github/workflows/zvonko-demo-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate worker and browser script syntax
        run: |
          node --input-type=module --check < zvonko/worker.js
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const code=fs.readFileSync('zvonko/worker.js','utf8');
          const html=JSON.parse(code.match(/const PLATFORM_HTML=(.*);\nconst TELEPHONY_HTML=/)[1]);
          new vm.Script(html.match(/<script>([\s\S]+)<\/script>/)[1]);
          console.log('PASS browser syntax');
          JS
      - name: Browser journey with mocked AI transport
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const fs=await import('node:fs');fs.mkdirSync('screenshots',{recursive:true});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.route('**/api/chat',async route=>{const b=route.request().postDataJSON();await route.fulfill({json:{answer:'Тестовый ответ: выберите удобное время.',action:b.text.includes('записаться')?'offer_slots':null}})});
            await page.goto('https://zvonko-ai.mishkafedotov09.workers.dev/demo');
            await page.screenshot({path:'screenshots/demo-mobile.png',fullPage:true});
            await page.getByText('Попробуйте AI на реальном сценарии').waitFor();
            await page.screenshot({path:'screenshots/chat-mobile.png',fullPage:true});
            await page.getByRole('button',{name:'Записаться ↗'}).click();
            await page.locator('[data-pickslot="10:00"]').click();
            await page.locator('#confirm-slot').click();
            await page.getByText('Тестовая запись подтверждена',{exact:false}).first().waitFor();
            await page.screenshot({path:'screenshots/booking-mobile.png',fullPage:true});
            await page.getByRole('button',{name:'Открыть заявки ↗'}).click();
            await page.getByText('Тестовая запись: Диагностика техники · завтра 10:00',{exact:true}).waitFor();
            assert.equal(errors.length,0,errors.join(';'));
            assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=window.innerWidth+2),'mobile overflow');
            console.log('PASS mobile browser journey (mock AI), booking confirmation and lead');
          }finally{const desktop=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});await desktop.goto('https://zvonko-ai.mishkafedotov09.workers.dev/');await desktop.screenshot({path:'screenshots/home-desktop.png',fullPage:true});await desktop.goto('https://zvonko-ai.mishkafedotov09.workers.dev/demo');await desktop.screenshot({path:'screenshots/demo-desktop.png',fullPage:true});await browser.close()}
          JS
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zvonko-browser-screenshots
          path: screenshots/
          retention-days: 3
      - name: Check production health and real AI response
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://zvonko-ai.mishkafedotov09.workers.dev';
          const health=await fetch(base+'/api/health',{signal:AbortSignal.timeout(20000)});
          assert.equal(health.status,200);
          const h=await health.json();assert.equal(h.version,'2.3');assert.equal(h.ai,true);
          const page=await fetch(base+'/demo',{signal:AbortSignal.timeout(20000)});
          assert.equal(page.status,200);assert.match(await page.text(),/Попробуйте AI на реальном сценарии/);
          const chat=await fetch(base+'/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:'Сколько стоит диагностика?',context:{company:'Демо Сервис',product:'Ремонт техники',price:'Диагностика 800 рублей',faq:'09:00–19:00'},history:[]}),signal:AbortSignal.timeout(60000)});
          const d=await chat.json();assert.equal(chat.status,200,JSON.stringify(d));assert.ok(d.answer?.length);assert.match(d.answer,/800/);console.log('PASS public health, demo route and AI response');
          const book=await fetch(base+'/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:'Хочу записаться на завтра',context:{company:'Демо Сервис',product:'Ремонт техники',price:'Диагностика 800 рублей'},history:[]}),signal:AbortSignal.timeout(60000)});const b=await book.json();assert.equal(book.status,200,JSON.stringify(b));assert.equal(b.action,'offer_slots');console.log('PASS booking action');
          JS
