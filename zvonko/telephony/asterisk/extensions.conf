; Inbound calls ONLY from the authenticated/identified Novofon trunk.
; Do not assign this context to anonymous or untrusted endpoints.
[zvonko-inbound]
exten => s,1,NoOp(Zvonko SIP inbound)
 same => n,Answer()
 same => n,Stasis(zvonko,inbound)
 same => n,Hangup()

; Novofon typically sends the registered SIP login as the dialled extension.
exten => _X.,1,NoOp(Zvonko Novofon inbound to ${EXTEN})
 same => n,Answer()
 same => n,Stasis(zvonko,inbound)
 same => n,Hangup()

; No generic outbound dialplan. Outbound manual tests can only be
; initiated via authenticated localhost API with an allowlisted number.
